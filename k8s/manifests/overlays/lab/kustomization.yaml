apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auto-repair-shop

# Restricted-account (AWS Academy Learner Lab) overlay. No ALB Ingress and no External Secrets: IRSA is unavailable.
# The Secret is created by the pipeline from Secrets Manager. No LoadBalancer: the service is ClusterIP.
resources:
  - ../../base

components:
  - ../../components/observability
