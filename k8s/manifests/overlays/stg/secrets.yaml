# External Secrets Operator reads JWT_SECRET from Secrets Manager (auto-repair-shop-stg/history) and materialises it into
# the k8s Secret `history-service-secrets` consumed by the Deployment. Only valid with IRSA (see README).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # No serviceAccountRef: uses the External Secrets controller's IRSA role.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: history-service-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: history-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: auto-repair-shop-stg/history
        property: JWT_SECRET
