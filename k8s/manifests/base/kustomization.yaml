apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auto-repair-shop

# The History workload only. Networking is owned by Terraform in auto-repair-shop-infra-k8s; the DynamoDB table and
# the queues by their own Terraform states. No database migrations: the service has no Postgres.
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml

images:
  - name: auto-repair-shop-history-service
    newTag: dev
