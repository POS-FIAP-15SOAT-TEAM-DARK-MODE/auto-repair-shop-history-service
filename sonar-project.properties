sonar.projectKey=POS-FIAP-15SOAT-TEAM-DARK-MODE_auto-repair-shop-history-service
sonar.organization=pos-fiap-15soat-team-dark-mode

sonar.projectName=History & Reporting
sonar.projectVersion=1.0

sonar.sources=.
# Analyze Go source only.
sonar.inclusions=**/*.go
sonar.exclusions=**/*_test.go,**/mocks/**,docs/**,tmp/**,cmd/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out

sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go
sonar.issue.ignore.multicriteria.e2.ruleKey=*
sonar.issue.ignore.multicriteria.e2.resourceKey=**/mocks/**
